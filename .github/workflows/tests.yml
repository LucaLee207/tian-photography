name: Vitest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: test_db
          POSTGRES_PASSWORD: password123
        ports:
          - 5433:5432 # Maps GitHub's 5432 to your app's 5433
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install dependencies
        run: npm install
        working-directory: ./server

      - name: Run Vitest tests
        run: npm test
        working-directory: ./server
        env:
          # Add any dummy env variables your code needs to not crash
          R2_ENDPOINT: https://dummy.endpoint
          R2_ACCESS_KEY: dummy_key
          R2_SECRET_KEY: dummy_secret
          DB_HOST: localhost
          DB_USER: postgres
          DB_PASS: password123
          DB_NAME: test_db
          LOGIN_EMAIL: dummy_login_email
          LOGIN_HASHED_PASSWORD: $2b$10$HRQZXGFGXBkxMRxsEsc/iuMT.WIiupiAqZi2dm71e4mijnTUsxHta
          LOGIN_PASSWORD: dummy_password
          JWT_SECRET: dummy_secret
